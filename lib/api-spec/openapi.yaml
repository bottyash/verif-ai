openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: verifai
    description: Startup idea validation and founder workspace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /verifai/admin/overview:
    get:
      operationId: getVerifaiAdminOverview
      tags: [verifai]
      summary: Get VerifAI administrator metrics
      responses:
        "200":
          description: User, report, and unlock funnel metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "503":
          description: Administrator access is not configured
  /verifai/admin/reports:
    get:
      operationId: getVerifaiAdminReports
      tags: [verifai]
      summary: List all generated VerifAI reports for administrators
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportPage"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "503":
          description: Administrator access is not configured
  /verifai/admin/reports/{reportId}:
    get:
      operationId: getVerifaiAdminReport
      tags: [verifai]
      summary: Get a complete generated report for an administrator
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Complete generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReportDetail"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Report not found
        "503":
          description: Administrator access is not configured
  /verifai/dashboard:
    get:
      operationId: getVerifaiDashboard
      tags: [verifai]
      summary: Get founder dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /verifai/ideas:
    get:
      operationId: listVerifaiIdeas
      tags: [verifai]
      summary: List the signed-in founder's ideas
      responses:
        "200":
          description: Founder ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Idea"
    post:
      operationId: createVerifaiIdea
      tags: [verifai]
      summary: Create a startup idea for validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaInput"
      responses:
        "201":
          description: Idea created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
  /verifai/ideas/{ideaId}:
    get:
      operationId: getVerifaiIdea
      tags: [verifai]
      summary: Get one idea and its current validation state
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Idea detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
        "404":
          description: Idea not found
  /verifai/ideas/{ideaId}/questions:
    post:
      operationId: generateVerifaiQuestions
      tags: [verifai]
      summary: Generate the three-tier idea refinement questionnaire
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered question tiers for the idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSet"
  /verifai/ideas/{ideaId}/answers:
    put:
      operationId: saveVerifaiAnswers
      tags: [verifai]
      summary: Save founder answers to refinement questions
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaAnswersInput"
      responses:
        "200":
          description: Updated idea and answer progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Idea"
  /verifai/ideas/{ideaId}/analysis:
    post:
      operationId: runVerifaiAnalysis
      tags: [verifai]
      summary: Run the multi-agent startup validation analysis
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
  /verifai/ideas/{ideaId}/report:
    get:
      operationId: getVerifaiReport
      tags: [verifai]
      summary: Get the latest validation report for an idea
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"
        "404":
          description: Report not found
  /verifai/ideas/{ideaId}/checkout-status:
    get:
      operationId: getVerifaiCheckoutStatus
      tags: [verifai]
      summary: Check whether the Pine Labs unlock is available
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pine Labs configuration and idea unlock status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStatus"
  /verifai/ideas/{ideaId}/unlock-click:
    post:
      operationId: trackVerifaiUnlockClick
      tags: [verifai]
      summary: Record a click on the no-charge research unlock
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unlock offer click recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockClickResponse"
        "404":
          description: Idea or report not found
  /verifai/ideas/{ideaId}/demo-unlock:
    post:
      operationId: demoUnlockVerifaiReport
      tags: [verifai]
      summary: Unlock a full report for product research without taking payment
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoUnlockInput"
      responses:
        "200":
          description: No-charge report unlocked and optional price intent stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoUnlockResponse"
        "404":
          description: Idea not found
        "409":
          description: Generate a report before unlocking it
  /verifai/ideas/{ideaId}/payments:
    post:
      operationId: createVerifaiPayment
      tags: [verifai]
      summary: Create a one-time ₹20 Pine Labs payment order
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
  /verifai/ideas/{ideaId}/payments/{paymentId}:
    get:
      operationId: getVerifaiPaymentStatus
      tags: [verifai]
      summary: Verify a Pine Labs payment and unlock the full report
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
  /verifai/ideas/{ideaId}/messages:
    get:
      operationId: getVerifaiMessages
      tags: [verifai]
      summary: Get the signed-in founder's persisted idea-chat history
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHistory"
    post:
      operationId: sendVerifaiMessage
      tags: [verifai]
      summary: Refine an idea with the post-report assistant
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderMessageInput"
      responses:
        "200":
          description: Assistant reply and next actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderMessageReply"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IdeaInput:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          minLength: 20
          maxLength: 6000
        problem:
          type: string
          maxLength: 2000
        targetCustomer:
          type: string
          maxLength: 1000
        targetMarket:
          type: string
          maxLength: 120
          default: India
    Idea:
      type: object
      required: [id, name, description, targetMarket, stage, progress, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        problem: { type: ["string", "null"] }
        targetCustomer: { type: ["string", "null"] }
        targetMarket: { type: string }
        stage:
          type: string
          enum: [draft, questions, analyzing, report_ready]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        readinessScore:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Question:
      type: object
      required: [id, tier, prompt, rationale, required]
      properties:
        id: { type: string }
        tier:
          type: integer
          enum: [1, 2, 3]
        prompt: { type: string }
        rationale: { type: string }
        required: { type: boolean }
        answer: { type: ["string", "null"] }
    QuestionTier:
      type: object
      required: [tier, title, description, questions]
      properties:
        tier:
          type: integer
          enum: [1, 2, 3]
        title: { type: string }
        description: { type: string }
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    QuestionSet:
      type: object
      required: [ideaId, tiers, answeredCount, totalCount]
      properties:
        ideaId: { type: string }
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/QuestionTier"
        answeredCount: { type: integer }
        totalCount: { type: integer }
    IdeaAnswer:
      type: object
      required: [questionId, answer]
      properties:
        questionId: { type: string }
        answer:
          type: string
          maxLength: 3000
    IdeaAnswersInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/IdeaAnswer"
    ReportSection:
      type: object
      required: [key, title, score, summary, strengths, improvements, evidence]
      properties:
        key:
          type: string
          enum: [market, technology, customers, go_to_market, risks, legal]
        title: { type: string }
        score:
          type: integer
          minimum: 0
          maximum: 100
        summary: { type: string }
        strengths:
          type: array
          items: { type: string }
        improvements:
          type: array
          items: { type: string }
        evidence:
          type: array
          items: { type: string }
    ReportHeadlineSnapshot:
      type: object
      required: [market, audience, financialSignals, quickRatings, teasers]
      properties:
        market:
          type: object
          required: [tam, sam, som, cagr, stage]
          properties:
            tam: { type: ["string", "null"] }
            sam: { type: ["string", "null"] }
            som: { type: ["string", "null"] }
            cagr: { type: ["string", "null"] }
            stage:
              type: string
              enum: [emerging, growing, saturated, unknown]
        audience:
          type: object
          required: [primarySegment, ageGroup, estimatedReachableUsers, topRegion]
          properties:
            primarySegment: { type: ["string", "null"] }
            ageGroup: { type: ["string", "null"] }
            estimatedReachableUsers: { type: ["string", "null"] }
            topRegion: { type: ["string", "null"] }
        financialSignals:
          type: object
          required: [startupCostRange, breakEvenTimeline, roiRating]
          properties:
            startupCostRange: { type: ["string", "null"] }
            breakEvenTimeline: { type: ["string", "null"] }
            roiRating:
              type: ["string", "null"]
              enum: [low, medium, high, null]
        quickRatings:
          type: object
          required: [technicalFeasibility, competitionPressure, legalComplexity, goToMarketDifficulty]
          properties:
            technicalFeasibility: { type: integer, minimum: 1, maximum: 5 }
            competitionPressure: { type: integer, minimum: 1, maximum: 5 }
            legalComplexity: { type: integer, minimum: 1, maximum: 5 }
            goToMarketDifficulty: { type: integer, minimum: 1, maximum: 5 }
        teasers:
          type: object
          required: [criticalRiskCount, competitorReviewCount, legalReviewCount, fundingReadinessAvailable]
          properties:
            criticalRiskCount: { type: integer, minimum: 0 }
            competitorReviewCount: { type: integer, minimum: 0 }
            legalReviewCount: { type: integer, minimum: 0 }
            fundingReadinessAvailable: { type: boolean }
    ReportRiskItem:
      type: object
      required: [risk, likelihood, impact, mitigation]
      properties:
        risk: { type: string }
        likelihood:
          type: string
          enum: [low, medium, high]
        impact:
          type: string
          enum: [low, medium, high]
        mitigation: { type: string }
    ReportScoreBreakdown:
      type: object
      required: [key, title, score, weightPercent]
      properties:
        key:
          type: string
          enum: [market, technology, customers, go_to_market, risks, legal]
        title: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        weightPercent: { type: number, minimum: 0, maximum: 100 }
    ReportFundingReadiness:
      type: object
      required: [score, investorFit, relevantPrograms, pitchGaps, valuationRange, likelyQuestions]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        investorFit:
          type: array
          items: { type: string }
        relevantPrograms:
          type: array
          items: { type: string }
        pitchGaps:
          type: array
          items: { type: string }
        valuationRange: { type: ["string", "null"] }
        likelyQuestions:
          type: array
          items: { type: string }
    ReportActionPlan:
      type: object
      required: [thisWeek, thisMonth, thisQuarter, validationExperiments]
      properties:
        thisWeek:
          type: array
          items: { type: string }
        thisMonth:
          type: array
          items: { type: string }
        thisQuarter:
          type: array
          items: { type: string }
        validationExperiments:
          type: array
          items: { type: string }
    PaidReportDetails:
      type: object
      required: [scoreBreakdown, marketAnalysis, customerAnalysis, competitorAnalysis, financialModel, technicalPlan, goToMarket, riskRegister, legalCompliance, fundingReadiness, actionPlan]
      properties:
        scoreBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ReportScoreBreakdown"
        marketAnalysis:
          type: array
          items: { type: string }
        customerAnalysis:
          type: array
          items: { type: string }
        competitorAnalysis:
          type: array
          items: { type: string }
        financialModel:
          type: array
          items: { type: string }
        technicalPlan:
          type: array
          items: { type: string }
        goToMarket:
          type: array
          items: { type: string }
        riskRegister:
          type: array
          items:
            $ref: "#/components/schemas/ReportRiskItem"
        legalCompliance:
          type: array
          items: { type: string }
        fundingReadiness:
          $ref: "#/components/schemas/ReportFundingReadiness"
        actionPlan:
          $ref: "#/components/schemas/ReportActionPlan"
    ReportScoreHistoryEntry:
      type: object
      required: [score, generatedAt]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        generatedAt: { type: string, format: date-time }
    ValidationReport:
      type: object
      required: [id, ideaId, ideaName, score, verdict, summary, sections, comparisons, nextSteps, headlineSnapshot, paidDetails, scoreHistory, generatedAt, isFullReport]
      properties:
        id: { type: string }
        ideaId: { type: string }
        ideaName: { type: string }
        score:
          type: integer
          minimum: 0
          maximum: 100
        verdict: { type: string }
        summary: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ReportSection"
        comparisons:
          type: array
          items: { type: string }
        nextSteps:
          type: array
          items: { type: string }
        headlineSnapshot:
          anyOf:
            - $ref: "#/components/schemas/ReportHeadlineSnapshot"
            - type: "null"
        paidDetails:
          anyOf:
            - $ref: "#/components/schemas/PaidReportDetails"
            - type: "null"
        scoreHistory:
          type: array
          items:
            $ref: "#/components/schemas/ReportScoreHistoryEntry"
        generatedAt: { type: string, format: date-time }
        isFullReport: { type: boolean }
    FounderMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
    FounderMessageReply:
      type: object
      required: [reply, suggestedPrompts]
      properties:
        reply: { type: string }
        suggestedPrompts:
          type: array
          items: { type: string }
    CheckoutStatus:
      type: object
      required: [provider, configured, amount, currency, unlocked]
      properties:
        provider: { type: string, enum: [pinelabs] }
        configured: { type: boolean }
        amount: { type: integer, const: 20 }
        currency: { type: string, enum: [INR] }
        unlocked: { type: boolean }
    UnlockClickResponse:
      type: object
      required: [clicked]
      properties:
        clicked: { type: boolean, const: true }
    DemoUnlockInput:
      type: object
      required: [willingnessToPay]
      properties:
        willingnessToPay:
          type: string
          enum: [yes, maybe, no, skip]
    DemoUnlockResponse:
      type: object
      required: [ideaId, unlocked, demo, willingnessToPay, testedPriceInr]
      properties:
        ideaId: { type: string }
        unlocked: { type: boolean, const: true }
        demo: { type: boolean, const: true }
        willingnessToPay:
          type: ["string", "null"]
          enum: [yes, maybe, no, null]
        testedPriceInr: { type: integer, const: 20 }
    CheckoutSession:
      type: object
      required: [paymentId, checkoutUrl, status, amount, currency]
      properties:
        paymentId: { type: string }
        checkoutUrl: { type: string, format: uri }
        status: { type: string }
        amount: { type: integer, const: 20 }
        currency: { type: string, enum: [INR] }
    PaymentStatus:
      type: object
      required: [paymentId, status, unlocked]
      properties:
        paymentId: { type: string }
        status:
          type: string
          enum: [CREATED, PENDING, PAID, FAILED, CANCELLED]
        unlocked: { type: boolean }
    AdminOverview:
      type: object
      required: [userCount, reportCount, freeOnlyReportCount, unlockClickCount, demoUnlockCount, payIntentAnswerCount, payIntentYesCount, payIntentMaybeCount, payIntentNoCount, payIntentSkipCount, payIntentYesRate, checkoutAttemptCount, paymentCompletedCount, paymentConversionRate]
      properties:
        userCount: { type: integer, minimum: 0 }
        reportCount: { type: integer, minimum: 0 }
        freeOnlyReportCount: { type: integer, minimum: 0 }
        unlockClickCount: { type: integer, minimum: 0 }
        demoUnlockCount: { type: integer, minimum: 0 }
        payIntentAnswerCount: { type: integer, minimum: 0 }
        payIntentYesCount: { type: integer, minimum: 0 }
        payIntentMaybeCount: { type: integer, minimum: 0 }
        payIntentNoCount: { type: integer, minimum: 0 }
        payIntentSkipCount: { type: integer, minimum: 0 }
        payIntentYesRate: { type: number, minimum: 0, maximum: 100 }
        checkoutAttemptCount: { type: integer, minimum: 0 }
        paymentCompletedCount: { type: integer, minimum: 0 }
        paymentConversionRate: { type: ["number", "null"], minimum: 0, maximum: 100 }
    AdminReport:
      type: object
      required: [id, ideaId, ideaName, ownerId, score, verdict, generatedAt, isFullReport, unlockedAt]
      properties:
        id: { type: string }
        ideaId: { type: string }
        ideaName: { type: string }
        ownerId: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        verdict: { type: string }
        generatedAt: { type: string, format: date-time }
        isFullReport: { type: boolean }
        unlockedAt: { type: ["string", "null"], format: date-time }
    AdminReportDetail:
      allOf:
        - $ref: "#/components/schemas/AdminReport"
        - type: object
          required: [summary, sections, comparisons, nextSteps, headlineSnapshot, paidDetails, scoreHistory]
          properties:
            summary: { type: string }
            sections:
              type: array
              items:
                $ref: "#/components/schemas/ReportSection"
            comparisons:
              type: array
              items: { type: string }
            nextSteps:
              type: array
              items: { type: string }
            headlineSnapshot:
              anyOf:
                - $ref: "#/components/schemas/ReportHeadlineSnapshot"
                - type: "null"
            paidDetails:
              anyOf:
                - $ref: "#/components/schemas/PaidReportDetails"
                - type: "null"
            scoreHistory:
              type: array
              items:
                $ref: "#/components/schemas/ReportScoreHistoryEntry"
    AdminReportPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminReport"
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    MessageHistory:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            required: [id, role, content, createdAt]
            properties:
              id: { type: integer }
              role: { type: string, enum: [user, assistant] }
              content: { type: string }
              createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [ideasCount, reportsCount, averageScore, recentIdeas]
      properties:
        ideasCount: { type: integer }
        reportsCount: { type: integer }
        averageScore: { type: ["number", "null"] }
        recentIdeas:
          type: array
          items:
            $ref: "#/components/schemas/Idea"

