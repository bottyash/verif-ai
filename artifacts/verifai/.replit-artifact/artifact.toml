kind = "web"
previewPath = "/"
title = "VerifAI"
description = "An AI-assisted validation workspace for Indian founders to pressure-test startup ideas, answer prioritized questions, review evidence-backed analysis, and refine a launch plan."
version = "1.0.0"
id = "artifacts/verifai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18418

[services.development]
run = "pnpm --filter @workspace/verifai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/verifai", "run", "build" ]
serve = "static"
publicDir = "artifacts/verifai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18418"
BASE_PATH = "/"
